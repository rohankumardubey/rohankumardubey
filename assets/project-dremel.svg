<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="title desc">
  <title id="title">Dremel</title>
  <desc id="desc">Columnar SQL engines in Rust and C++, exploring execution over the same workloads.</desc>
  <defs>
    <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#1B2125"/><stop offset="1" stop-color="#13181C"/></linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="559" height="249" rx="12" fill="url(#panel)" stroke="#3A4143"/>
  <path d="M30 1H94" stroke="#D0BA91" stroke-width="2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
